name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions required for the official Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stomping a deploy that's already in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Vite app
        run: npm run build

      # Copy legacy project subdirectories and assets into the dist output
      # so old links like /cope/, /tedx/, /360pro/, /Yikang_Wang_Resume.pdf still work.
      - name: Copy legacy assets into dist
        run: |
          for d in 360pro cope tedx categories tags img svg; do
            if [ -d "$d" ]; then cp -R "$d" dist/; fi
          done
          for f in *.pdf sitemap.xml index.xml; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
