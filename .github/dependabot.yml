version: 2
updates:
  # Keep GitHub Actions versions current (avoids deprecated runtimes).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  # Keep npm dependencies current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # One PR for routine dev-dependency bumps to cut noise.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
